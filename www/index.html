<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEN - Jeu de mots</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #081c15, #1b4332, #2d6a4f);
  color: white;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 500px;
  padding: 20px;
  text-align: center;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 8px;
  margin-top: 15px;
}

.subtitle {
  opacity: .75;
  margin-bottom: 25px;
}

.stats {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 25px;
}

.stat {
  flex: 1;
  background: rgba(255,255,255,.12);
  padding: 12px 8px;
  border-radius: 15px;
}

.stat small {
  display: block;
  opacity: .7;
  font-size: 12px;
}

.stat strong {
  font-size: 20px;
}

.card {
  background: rgba(255,255,255,.1);
  border-radius: 25px;
  padding: 25px 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.level {
  font-size: 15px;
  opacity: .8;
  margin-bottom: 8px;
}

.message {
  min-height: 25px;
  font-weight: bold;
  margin-bottom: 15px;
}

.word {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  min-height: 65px;
  margin: 15px 0 30px;
}

.case {
  width: 48px;
  height: 55px;
  border-radius: 12px;
  background: rgba(255,255,255,.15);
  border: 2px solid rgba(255,255,255,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  font-weight: bold;
}

.case.filled {
  background: white;
  color: #1b4332;
}

.letters {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.letter {
  border: none;
  border-radius: 15px;
  padding: 17px 5px;
  font-size: 23px;
  font-weight: bold;
  color: #1b4332;
  background: white;
  box-shadow: 0 5px 0 rgba(0,0,0,.2);
  cursor: pointer;
}

.letter:active {
  transform: translateY(4px);
  box-shadow: none;
}

.letter.used {
  opacity: .3;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.action {
  flex: 1;
  border: none;
  padding: 13px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
}

.delete {
  background: #ffcc00;
  color: #222;
}

.reset {
  background: rgba(255,255,255,.15);
  color: white;
}

.progress {
  height: 8px;
  background: rgba(255,255,255,.15);
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0 20px;
}

.progressBar {
  height: 100%;
  width: 0%;
  background: white;
  transition: width .4s;
}

.win {
  animation: victoire .5s ease;
}

@keyframes victoire {
  0% { transform: scale(.8); }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">ZEN</div>
  <div class="subtitle">Trouve les mots • Progresse • Gagne</div>

  <div class="stats">
    <div class="stat">
      <small>NIVEAU</small>
      <strong id="niveau">1</strong>
    </div>

    <div class="stat">
      <small>SCORE</small>

    </div>

    <div class="stat">
      <small>MOTS</small>

    </div>
  </div>

  <div class="card">

    <div class="level" id="difficulte">
      Facile
    </div>

    <div class="progress">
      <div class="progressBar" id="progressBar"></div>
    </div>

    <div class="message" id="message">

    <div class="word" id="word"></div>

    <div class="letters" id="letters"></div>

    <div class="actions">
      <button class="action delete" onclick="effacer()">⌫ Effacer</button>

/* ============================
   VARIABLES DU JEU
============================ */

let niveau = Number(localStorage.getItem("zen_niveau")) || 1;
let score = Number(localStorage.getItem("zen_score")) || 0;
let motsTrouves = Number(localStorage.getItem("zen_mots")) || 0;

let motActuel = "";
let lettresMelangees = [];
let motJoueur = [];

/* ============================
   ELEMENTS
============================ */

const wordDiv = document.getElementById("word");
const lettersDiv = document.getElementById("letters");
const messageDiv = document.getElementById("message");
const niveauDiv = document.getElementById("niveau");
const scoreDiv = document.getElementById("score");
const motsDiv = document.getElementById("motsTrouves");
const difficulteDiv = document.getElementById("difficulte");
const progressBar = document.getElementById("progressBar");

/* ============================
   MELANGE
============================ */

function melanger(tableau) {
  return [...tableau].sort(() => Math.random() - 0.5);
}

/* ============================
   NOUVEAU MOT
============================ */

function nouveauMot() {

  motJoueur = [];

  let index = (niveau - 1) % mots.length;

  motActuel = mots[index].toUpperCase();

  lettresMelangees = melanger(motActuel.split(""));

  afficherMot();
  afficherLettres();
  afficherInfos();

  messageDiv.textContent = "Trouve le mot !";
  messageDiv.style.color = "white";
}

/* ============================
   AFFICHER CASES
============================ */

function afficherMot() {

  wordDiv.innerHTML = "";

  for (let i = 0; i < motActuel.length; i++) {

    const div = document.createElement("div");

    div.className = "case";

    if (motJoueur[i]) {
      div.textContent = motJoueur[i];
      div.classList.add("filled");
    }

    wordDiv.appendChild(div);
  }
}

/* ============================
   AFFICHER LETTRES
============================ */

function afficherLettres() {

  lettersDiv.innerHTML = "";

  lettresMelangees.forEach((lettre, index) => {

    const button = document.createElement("button");

    button.className = "letter";
    button.textContent = lettre;

    if (motJoueur.filter(x => x !== "").length >= motActuel.length) {
      button.disabled = true;
    }

    button.onclick = () => choisirLettre(lettre, index);

    lettersDiv.appendChild(button);
  });
}

/* ============================
   CHOISIR UNE LETTRE
============================ */

function choisirLettre(lettre, index) {

  if (motJoueur.length >= motActuel.length) return;

  motJoueur.push(lettre);

  afficherMot();

  if (motJoueur.length === motActuel.length) {

    const proposition = motJoueur.join("");

    if (proposition === motActuel) {

      gagner();

    } else {

      messageDiv.textContent = "❌ Mauvais mot !";
      messageDiv.style.color = "#ffcc00";

      setTimeout(() => {
        motJoueur = [];
        afficherMot();
        messageDiv.textContent = "Essaie encore !";
        afficherLettres();
      }, 900);
    }

  }

  afficherLettres();
}

/* ============================
   VICTOIRE
============================ */

function gagner() {

  const bonus = motActuel.length * 10;

  score += bonus;
  motsTrouves++;

  niveau++;

  localStorage.setItem("zen_score", score);
  localStorage.setItem("zen_mots", motsTrouves);
  localStorage.setItem("zen_niveau", niveau);

  messageDiv.textContent = `🎉 Bravo ! +${bonus} points`;
  messageDiv.style.color = "#7CFF9B";

  wordDiv.classList.add("win");

  setTimeout(() => {

    wordDiv.classList.remove("win");

    nouveauMot();

  }, 1200);
}

/* ============================
   EFFACER
============================ */

function effacer() {

  if (motJoueur.length > 0) {

    motJoueur.pop();

    afficherMot();
    afficherLettres();

  }
}

/* ============================
   INFOS
============================ */

function afficherInfos() {

  niveauDiv.textContent = niveau;
  scoreDiv.textContent = score;
  motsDiv.textContent = motsTrouves;

  if (motActuel.length <= 4) {
    difficulteDiv.textContent = "🟢 Facile";
  } 
  else if (motActuel.length <= 6) {
    difficulteDiv.textContent = "🟡 Moyen";
  } 
  else {
    difficulteDiv.textContent = "🔴 Difficile";
  }

  const progression = ((niveau - 1) % 10) * 10;

  progressBar.style.width = progression + "%";
}

/* ============================
   RECOMMENCER
============================ */

function nouvellePartie() {

  const confirmer = confirm(
    "Recommencer remettra ton niveau et ton score à zéro. Continuer ?"
  );

  if (!confirmer) return;

  niveau = 1;
  score = 0;
  motsTrouves = 0;

  localStorage.removeItem("zen_niveau");
  localStorage.removeItem("zen_score");
  localStorage.removeItem("zen_mots");

  nouveauMot();
}

/* ============================
   LANCEMENT
============================ */

nouveauMot();
