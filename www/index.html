<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEN 3.0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#061b16,#0b3b2d,#06251d);
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
}

.version{
  font-size:11px;
  opacity:.6;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  padding:10px 6px;
  text-align:center;
}

.stat-value{
  font-size:19px;
  font-weight:bold;
}

.stat-label{
  font-size:10px;
  opacity:.65;
  margin-top:3px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  border-radius:25px;
  padding:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.level{
  text-align:center;
  font-size:14px;
  opacity:.8;
  margin-bottom:8px;
}

.timer-box{
  height:9px;
  background:rgba(255,255,255,.1);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.timer{
  height:100%;
  width:100%;
  background:#36e59a;
  transition:width 1s linear;
}

.timer.danger{
  background:#ff5252;
}

.word-title{
  text-align:center;
  font-size:13px;
  opacity:.7;
}

.word{
  min-height:70px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0 22px;
}

.slot{
  width:42px;
  height:48px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:bold;
}

.slot.filled{
  background:#36e59a;
  color:#052018;
  border-color:#36e59a;
  animation:pop .18s ease;
}

.slot.hint{
  border-color:#ffd54a;
  color:#ffd54a;
}

@keyframes pop{
  0%{transform:scale(.7)}
  100%{transform:scale(1)}
}

.message{
  text-align:center;
  min-height:25px;
  font-size:14px;
  margin-bottom:12px;
}

.letters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.letter{
  height:58px;
  border:none;
  border-radius:15px;
  background:#ffffff;
  color:#08271e;
  font-size:23px;
  font-weight:900;
  box-shadow:0 5px 0 rgba(0,0,0,.15);
}

.letter:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.15);
}

.letter.used{
  opacity:.22;
  transform:none;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

button.action{
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:14px;
  font-weight:bold;
  background:rgba(255,255,255,.1);
  color:white;
}

button.hint-btn{
  background:#f0b90b;
  color:#171000;
}

.progress{
  margin-top:18px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  opacity:.65;
  margin-bottom:6px;
}

.progress-bar{
  height:7px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#36e59a;
  transition:.3s;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:.45;
  margin-top:18px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  z-index:10;
}

.overlay.show{
  display:flex;
}

.gameover{
  width:100%;
  max-width:380px;
  background:#0d3026;
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:30px;
  text-align:center;
}

.gameover h2{
  font-size:30px;
  margin-top:0;
}

.big-score{
  font-size:40px;
  font-weight:900;
  margin:15px 0;
}

.restart{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  background:#36e59a;
  color:#052018;
  font-weight:900;
  font-size:16px;
}

@media(max-width:360px){
  .slot{
    width:36px;
    height:43px;
  }

  .letter{
    height:52px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">ZEN</div>
    <div class="version">VERSION 3.0</div>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-value" id="lives">❤️❤️❤️</div>
      <div class="stat-label">VIES</div>
    </div>

    <div class="stat">
      <div class="stat-value" id="coins">🪙 0</div>
      <div class="stat-label">PIÈCES</div>
    </div>

    <div class="stat">
      <div class="stat-value" id="combo">🔥 0</div>
      <div class="stat-label">COMBO</div>
    </div>

  </div>

  <div class="card">

    <div class="level">
      NIVEAU <b id="level">1</b> · SCORE <b id="score">0</b>
    </div>

    <div class="timer-box">
      <div class="timer" id="timer"></div>
    </div>

    <div class="word-title">
      TROUVE LE MOT
    </div>

    <div class="word" id="word"></div>

    <div class="message" id="message">
      Forme le mot avec les lettres ci-dessous.
    </div>

    <div class="letters" id="letters"></div>

    <div class="actions">
      <button class="action" onclick="effacer()">
        ⌫ Effacer
      </button>

      <button class="action hint-btn" onclick="indice()">
        💡 Indice · 20 🪙
      </button>
    </div>

    <div class="progress">

      <div class="progress-top">
        <span>Progression</span>
        <span id="progressText">0%</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </div>

  </div>

  <div class="footer">
    ZEN · Trouve les mots · Progresse · Maîtrise
  </div>

</div>

<div class="overlay" id="gameOver">

  <div class="gameover">

    <h2>💔 Partie terminée</h2>

    <p>Tu as utilisé toutes tes vies.</p>

    <div class="big-score" id="finalScore">0</div>

    <p>Score final</p>

    <button class="restart" onclick="nouvellePartie()">
      🔄 Recommencer
    </button>

  </div>

</div>

<script>

/* =========================================================
   ZEN 3.0
   ========================================================= */

/* Banque de mots */
const motsBruts = [

"CHAT","CHIEN","LION","TIGRE","OURS","LOUP","RENARD","CHEVAL",
"VACHE","MOUTON","CHEVRE","COCHON","SINGE","GORILLE","ZEBRE",
"GIRAFE","ELEPHANT","HIPPOPOTAME","CROCODILE","SERPENT","TORTUE",
"LAPIN","RAT","SOURIS","POULE","COQ","CANARD","AIGLE","PIGEON",
"PERROQUET","POISSON","REQUIN","BALEINE","DAUPHIN","CRABE",
"CREVETTE","FOURMI","ABEILLE","PAPILLON","ARAIGNEE","MOUSTIQUE",

"MAISON","ECOLE","EGLISE","MARCHE","BOUTIQUE","JARDIN","PORTE",
"FENETRE","TABLE","CHAISE","LIVRE","STYLO","CAHIER","SAC",
"TELEPHONE","ORDINATEUR","RADIO","CAMERA","LAMPE","MOTEUR",
"VOITURE","MOTO","VELO","BUS","TRAIN","AVION","BATEAU",
"ROUTE","PONT","VILLE","VILLAGE","QUARTIER","PAYS","MONDE",

"EAU","PAIN","RIZ","POMME","BANANE","ORANGE","MANGUE","ANANAS",
"CITRON","PAPAYE","PASTEQUE","RAISIN","NOIX","CAFE","THE",
"SUCRE","SEL","POIVRE","VIANDE","POULET","POISSON","OEUF",
"FROMAGE","LAIT","BEURRE","GATEAU","CHOCOLAT","GLACE","PIZZA",
"BURGER","SANDWICH","SALAD","SOUPE","SAUCE","IGNAME","MANIOC",
"BANANE","MAIS","HARICOT","ARACHIDE","ATIEKE","ALLOCO","FOUTOU",

"FOOTBALL","BALLON","JOUEUR","ENTRAINEUR","EQUIPE","STADE",
"BUT","PASSE","TIR","CORNER","DEFENSE","ATTAQUE","GARDIEN",
"MILIEU","CAPITAINE","ARBITRE","MATCH","LIGUE","COUPE","CHAMPION",
"VICTOIRE","DEFAITE","TACTIQUE","SYSTEME","COACH","DRIBBLE",
"VITESSE","FORCE","TECHNIQUE","SPORT","ATHLETE","MEDAILLE",
"TOURNOI","FINAL","SELECTION","NATION","CAN","MONDIAL",

"AFRIQUE","IVOIRE","BOUAKE","ABIDJAN","YAMOUSSOUKRO","KORHOGO",
"DALOA","MAN","SANPEDRO","BONDOUKOU","DIVO","GAGNOA","AGBOVILLE",
"ODIENNE","BINGERVILLE","GRANDBASSAM","ASSINIE","COMOE","SAVANE",
"FORET","LAGUNE","MONTAGNE","PLAGE","RIVIERE","FLEUVE","PAYSAGE",

"SOLEIL","LUNE","ETOILE","CIEL","NUAGE","PLUIE","VENT","ORAGE",
"TONNERRE","FOUDRE","ARBRE","FLEUR","HERBE","FEUILLE","FRUIT",
"RACINE","GRAINE","TERRE","SABLE","ROCHE","PIERRE","FEU","EAU",
"MER","OCEAN","SOURCE","NATURE","PLANETE","ESPACE","GALAXIE",

"AMOUR","AMITIE","FAMILLE","FRERE","SOEUR","PERE","MERE","ENFANT",
"AMI","BONHEUR","JOIE","PAIX","ESPOIR","COURAGE","FORCE","REVE",
"SUCCES","TRAVAIL","EFFORT","PATIENCE","RESPECT","HONNEUR",
"CONFIANCE","SOURIRE","RIRE","MOTIVATION","PASSION","TALENT",
"IDEe","OBJECTIF","PROJET","AVENIR","LIBERTE","VERITE","SAGESSE",

"ROUGE","BLEU","VERT","JAUNE","NOIR","BLANC","ORANGE","VIOLET",
"ROSE","MARRON","GRIS","COULEUR","LUMIERE","OMBRE","BRILLANT",
"RAPIDE","LENT","GRAND","PETIT","FORT","FAIBLE","CHAUD","FROID",
"JEUNE","VIEUX","NOUVEAU","ANCIEN","BEAU","SIMPLE","FACILE","DIFFICILE",

"UN","DEUX","TROIS","QUATRE","CINQ","SIX","SEPT","HUIT","NEUF","DIX",
"PREMIER","SECOND","DERNIER","DEBUT","MILIEU","FIN","TEMPS","JOUR",
"NUIT","MATIN","SOIR","SEMAINE","MOIS","ANNEE","HEURE","MINUTE",

"SCIENCE","MATH","FRANCAIS","ANGLAIS","HISTOIRE","GEOGRAPHIE",
"PHYSIQUE","CHIMIE","ELECTRONIQUE","ELECTRICITE","CIRCUIT",
"RESISTANCE","TENSION","COURANT","MOTEUR","LED","DIODE","TRANSISTOR",
"CAPTEUR","BATTERIE","ENERGIE","ORDINATEUR","PROGRAMME","CODE",
"APPLICATION","JEU","INTERNET","RESEAU","SERVEUR","DONNEE",

"MUSIQUE","CHANSON","ARTISTE","CHANTEUR","DANSE","GUITARE","PIANO",
"BATTERIE","MICRO","STUDIO","CONCERT","RYTHME","MELODIE","SON",
"VOIX","VIDEO","FILM","ACTEUR","ACTRICE","CINEMA","THEATRE",
"HISTOIRE","ROMAN","LIVRE","AUTEUR","POEME","DESSIN","PHOTO",

"BUSINESS","ARGENT","BANQUE","ENTREPRISE","COMMERCE","VENTE",
"CLIENT","PRODUIT","SERVICE","MARCHE","PRIX","PROFIT","CAPITAL",
"TRAVAIL","EMPLOI","METIER","PATRON","EQUIPE","PROJET","IDEe",
"INVESTISSEMENT","ECONOMIE","RICHESSE","SUCCES","LEADER","MARQUE",
"VENTEUR","ACHAT","REVENU","OBJECTIF"

];

/* Nettoyage des mots */
const mots = [...new Set(
  motsBruts
  .map(m => m.normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^A-Z]/g,""))
  .filter(m => m.length >= 3)
)];

/* Variables du jeu */
let score = Number(localStorage.getItem("zen_score") || 0);
let niveau = Number(localStorage.getItem("zen_niveau") || 1);
let pieces = Number(localStorage.getItem("zen_coins") || 30);
let vies = Number(localStorage.getItem("zen_lives") || 3);
let combo = Number(localStorage.getItem("zen_combo") || 0);
let motsTrouves = Number(localStorage.getItem("zen_mots") || 0);

let motActuel = "";
let lettresMelangees = [];
let selection = [];
let indicesUtilises = [];
let hintIndex = -1;

let tempsMax = 20;
let temps = tempsMax;
let timerInterval = null;
let verrouille = false;

/* Mélange */
function melanger(tableau){
  const copie = [...tableau];

  for(let i=copie.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copie[i],copie[j]]=[copie[j],copie[i]];
  }

  return copie;
}

/* Choisir un mot */
function choisirMot(){

  const disponibles = mots.filter(m => m !== motActuel);

  motActuel =
    disponibles[Math.floor(Math.random()*disponibles.length)];

  lettresMelangees = melanger(
    motActuel.split("")
  );

  selection = [];
  indicesUtilises = [];
  hintIndex = -1;

  tempsMax = Math.max(
    10,
    25 - Math.floor(niveau/5)
  );

  temps = tempsMax;

  afficher();
  demarrerTimer();
}

/* Affichage */
function afficher(){

  document.getElementById("level").textContent = niveau;
  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = "🪙 " + pieces;
  document.getElementById("combo").textContent = "🔥 " + combo;

  afficherVies();
  afficherMot();
  afficherLettres();
  afficherProgression();
}

/* Vies */
function afficherVies(){

  let texte = "";

  for(let i=0;i<3;i++){
    texte += i < vies ? "❤️" : "🖤";
  }

  document.getElementById("lives").textContent = texte;
}

/* Mot */
function afficherMot(){

  const zone = document.getElementById("word");
  zone.innerHTML = "";

  for(let i=0;i<motActuel.length;i++){

    const slot = document.createElement("div");
    slot.className = "slot";

    if(selection[i]){
      slot.textContent = selection[i];
      slot.classList.add("filled");
    }

    if(i === hintIndex && !selection[i]){
      slot.textContent = "?";
      slot.classList.add("hint");
    }

    zone.appendChild(slot);
  }
}

/* Lettres */
function afficherLettres(){

  const zone = document.getElementById("letters");
  zone.innerHTML = "";

  lettresMelangees.forEach((lettre,index)=>{

    const bouton = document.createElement("button");

    bouton.className = "letter";

    bouton.textContent = lettre;

    if(indicesUtilises.includes(index)){
      bouton.classList.add("used");
    }

    if(index === getHintButtonIndex()){
      bouton.style.outline = "3px solid #ffd54a";
    }

    bouton.onclick = () => choisirLettre(index);

    zone.appendChild(bouton);
  });
}

/* Trouver la lettre correspondant à l'indice */
function getHintButtonIndex(){

  if(hintIndex < 0) return -1;

  const lettreRecherchee = motActuel[hintIndex];

  for(let i=0;i<lettresMelangees.length;i++){

    if(
      lettresMelangees[i] === lettreRecherchee &&
      !indicesUtilises.includes(i)
    ){
      return i;
    }
  }

  return -1;
}

/* Choisir une lettre */
function choisirLettre(index){

  if(verrouille) return;

  if(indicesUtilises.includes(index)) return;

  if(selection.length >= motActuel.length) return;

  const lettre = lettresMelangees[index];

  indicesUtilises.push(index);
  selection.push(lettre);

  if(
    hintIndex >= 0 &&
    selection.length-1 === hintIndex
  ){
    hintIndex = -1;
  }

  afficherMot();
  afficherLettres();

  if(selection.length === motActuel.length){
    verifierMot();
  }
}

/* Effacer */
function effacer(){

  if(verrouille) return;

  if(selection.length === 0) return;

  const position = selection.length-1;

  if(position === hintIndex){
    return;
  }

  selection.pop();
  indicesUtilises.pop();

  afficherMot();
  afficherLettres();
}

/* Vérifier */
function verifierMot(){

  const proposition = selection.join("");

  if(proposition === motActuel){

    verrouille = true;

    arreterTimer();

    combo++;

    const bonusCombo = combo * 2;
    const bonusLongueur = motActuel.length * 2;

    const gain = 5 + bonusCombo + bonusLongueur;

    score += gain;
    pieces += gain;
    motsTrouves++;

    if(combo % 5 === 0){
      pieces += 15;
      score += 15;

      message(
        "🔥 SUPER COMBO ! +15 🪙"
      );
    }else{
      message(
        "✅ Bravo ! +" + gain + " 🪙"
      );
    }

    niveau =
      Math.floor(motsTrouves / 5) + 1;

    sauvegarder();
    afficher();

    setTimeout(()=>{

      verrouille = false;
      choisirMot();

    },900);

  }else{

    perdreVie();
  }
}

/* Mauvaise réponse */
function perdreVie(){

  vies--;
  combo = 0;

  sauvegarder();
  afficher();

  message("❌ Mauvais mot ! -1 ❤️");

  selection = [];
  indicesUtilises = [];
  hintIndex = -1;

  afficherMot();
  afficherLettres();

  if(vies <= 0){

    arreterTimer();

    setTimeout(()=>{
      document.getElementById("finalScore").textContent = score;
      document.getElementById("gameOver").classList.add("show");
    },500);

    return;
  }

  temps = tempsMax;
}

/* Indice */
function indice(){

  if(verrouille) return;

  if(pieces < 20){

    message("🪙 Il te faut 20 pièces.");

    return;
  }

  const position = selection.length;

  if(position >= motActuel.length){
    return;
  }

  pieces -= 20;

  hintIndex = position;

  sauvegarder();

  afficher();
  message("💡 Indice : la lettre dorée est la bonne.");

}

/* Timer */
function demarrerTimer(){

  arreterTimer();

  timerInterval = setInterval(()=>{

    if(verrouille) return;

    temps--;

    afficherTimer();

    if(temps <= 0){

      arreterTimer();

      vies--;
      combo = 0;

      sauvegarder();
      afficher();

      message("⏰ Temps écoulé ! -1 ❤️");

      if(vies <= 0){

        document.getElementById("finalScore").textContent = score;
        document.getElementById("gameOver").classList.add("show");

        return;
      }

      setTimeout(()=>{
        choisirMot();
      },700);
    }

  },1000);

  afficherTimer();
}

/* Arrêter timer */
function arreterTimer(){

  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

/* Afficher timer */
function afficherTimer(){

  const element = document.getElementById("timer");

  const pourcentage =
    Math.max(0,(temps/tempsMax)*100);

  element.style.width = pourcentage + "%";

  if(pourcentage <= 30){
    element.classList.add("danger");
  }else{
    element.classList.remove("danger");
  }
}

/* Message */
function message(texte){

  document.getElementById("message").textContent = texte;
}

/* Progression */
function afficherProgression(){

  const dansNiveau = motsTrouves % 5;

  const pourcentage =
    (dansNiveau / 5) * 100;

  document.getElementById("progressFill")
    .style.width = pourcentage + "%";

  document.getElementById("progressText")
    .textContent =
      dansNiveau + " / 5";
}

/* Sauvegarde */
function sauvegarder(){

  localStorage.setItem(
    "zen_score",
    score
  );

  localStorage.setItem(
    "zen_niveau",
    niveau
  );

  localStorage.setItem(
    "zen_coins",
    pieces
  );

  localStorage.setItem(
    "zen_lives",
    vies
  );

  localStorage.setItem(
    "zen_combo",
    combo
  );

  localStorage.setItem(
    "zen_mots",
    motsTrouves
  );
}

/* Nouvelle partie */
function nouvellePartie(){

  document
    .getElementById("gameOver")
    .classList.remove("show");

  score = 0;
  niveau = 1;
  pieces = 30;
  vies = 3;
  combo = 0;
  motsTrouves = 0;

  sauvegarder();

  choisirMot();
}

/* Démarrage */
afficher();
choisirMot();

</script>

</body>
</html>
