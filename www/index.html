<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZEN 7.0</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#111827,#312e81,#0f766e);
color:white;
min-height:100vh;
}

.app{
max-width:520px;
margin:auto;
padding:18px;
}

header{
text-align:center;
padding:18px 0;
}

.logo{
font-size:44px;
font-weight:900;
letter-spacing:4px;
}

.subtitle{
opacity:.75;
}

.card{
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:20px;
margin-bottom:16px;
backdrop-filter:blur(10px);
box-shadow:0 12px 35px rgba(0,0,0,.2);
}

h2{
margin-top:0;
}

button{
width:100%;
border:0;
border-radius:16px;
padding:15px;
margin:7px 0;
font-size:16px;
font-weight:bold;
background:white;
color:#172033;
cursor:pointer;
transition:.2s;
}

button:active{
transform:scale(.97);
}

.option{
background:rgba(255,255,255,.12);
color:white;
border:1px solid rgba(255,255,255,.15);
}

.option.correct{
background:#16a34a;
}

.option.wrong{
background:#dc2626;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.small{
font-size:13px;
opacity:.7;
}

.hidden{
display:none;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
text-align:center;
}

.stat{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:15px;
}

.value{
font-size:22px;
font-weight:bold;
}

.progress{
height:9px;
background:rgba(255,255,255,.15);
border-radius:20px;
overflow:hidden;
margin:12px 0;
}

.progress div{
height:100%;
background:#facc15;
width:0%;
transition:.3s;
}

.timer{
text-align:center;
font-size:30px;
font-weight:bold;
}

#question{
font-size:22px;
line-height:1.4;
}

.message{
text-align:center;
font-weight:bold;
min-height:25px;
margin-top:10px;
}

.badge{
display:inline-block;
background:#facc15;
color:#111827;
padding:6px 10px;
border-radius:20px;
font-weight:bold;
}

.mode-selected,
.category-selected{
outline:3px solid #facc15;
}

.levelBox{
text-align:center;
font-size:14px;
opacity:.85;
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">ZEN</div>
<div class="subtitle">Réfléchis. Réponds. Progresse.</div>
</header>


<!-- ACCUEIL -->

<section id="home">

<div class="card">

<h2>🎮 Catégorie</h2>

<div class="grid">

<button id="catCulture" onclick="selectCategory('culture')">
🌍 Culture
</button>

<button id="catScience" onclick="selectCategory('science')">
🔬 Science
</button>

<button id="catSport" onclick="selectCategory('sport')">
⚽ Sport
</button>

<button id="catLogique" onclick="selectCategory('logique')">
🧠 Logique
</button>

</div>

<p id="categoryName" class="small">
Catégorie : Toutes
</p>

</div>


<div class="card">

<h2>⚡ Mode</h2>

<button id="modeClassic" onclick="selectMode('classic')">
🎯 Classique
</button>

<button id="modeChrono" onclick="selectMode('chrono')">
⏱️ Chrono
</button>

<button id="modeSurvie" onclick="selectMode('survie')">
🔥 Survie
</button>

<button id="modeChallenge" onclick="selectMode('challenge')">
💥 Défi
</button>

<p id="modeName" class="small">
Mode : Classique
</p>

</div>


<div class="card">

<div class="levelBox">
Niveau <strong id="homeLevel">1</strong>
<br>
<span id="homeXP">0</span> XP
</div>

<br>

<div class="stats">

<div class="stat">
<div class="value" id="homeCoins">0</div>
💰
</div>

<div class="stat">
<div class="value" id="homeGames">0</div>
Parties
</div>

<div class="stat">
<div class="value" id="homeBest">0</div>
Record
</div>

</div>

</div>


<button onclick="startGame()">
🚀 COMMENCER
</button>

<button onclick="showStats()">
📊 Mes statistiques
</button>

</section>



<!-- JEU -->

<section id="game" class="hidden">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center">

<span id="questionNumber">
Question 1
</span>

<span class="badge">
🔥 <span id="combo">0</span>
</span>

</div>


<div class="progress">
<div id="progress"></div>
</div>


<div id="timer" class="timer hidden">
15
</div>


<p id="question"></p>

<div id="answers"></div>

<div id="message" class="message"></div>

</div>


<button onclick="quitGame()">
⬅️ Quitter
</button>

</section>



<!-- RESULTAT -->

<section id="result" class="hidden">

<div class="card" style="text-align:center">

<h2>🎉 Partie terminée !</h2>

<p>Score</p>

<div id="finalScore"
style="font-size:48px;font-weight:bold">
0
</div>

<p id="finalMessage"></p>

<div class="stats">

<div class="stat">
<div class="value" id="finalXP">0</div>
XP
</div>

<div class="stat">
<div class="value" id="finalCoins">0</div>
💰
</div>

<div class="stat">
<div class="value" id="finalCorrect">0</div>
✓
</div>

</div>

</div>


<button onclick="startGame()">
🔄 Rejouer
</button>

<button onclick="goHome()">
🏠 Accueil
</button>

</section>



<!-- STATISTIQUES -->

<section id="statistics" class="hidden">

<div class="card">

<h2>📊 Tes statistiques</h2>

<div class="stats">

<div class="stat">
<div class="value" id="sGames">0</div>
Parties
</div>

<div class="stat">
<div class="value" id="sCorrect">0</div>
Bonnes
</div>

<div class="stat">
<div class="value" id="sBest">0</div>
Record
</div>

</div>

<br>

<div class="stats">

<div class="stat">
<div class="value" id="sLevel">1</div>
Niveau
</div>

<div class="stat">
<div class="value" id="sXP">0</div>
XP
</div>

<div class="stat">
<div class="value" id="sCoins">0</div>
💰
</div>

</div>

</div>


<button onclick="goHome()">
🏠 Retour
</button>

<button onclick="resetData()">
🗑️ Réinitialiser
</button>

</section>

</div>



<script>


// ================================
// QUESTIONS
// ================================

const questions=[

{
c:"culture",
q:"Quelle est la capitale de la Côte d’Ivoire ?",
a:["Bouaké","Yamoussoukro","Abidjan","Korhogo"],
x:1
},

{
c:"culture",
q:"Combien de continents compte-t-on généralement ?",
a:["5","6","7","8"],
x:2
},

{
c:"culture",
q:"Quelle langue est principalement parlée au Brésil ?",
a:["Espagnol","Portugais","Français","Anglais"],
x:1
},

{
c:"culture",
q:"Quel océan borde la Côte d’Ivoire ?",
a:["Atlantique","Pacifique","Indien","Arctique"],
x:0
},

{
c:"science",
q:"Quelle planète est la plus proche du Soleil ?",
a:["Mars","Vénus","Mercure","Jupiter"],
x:2
},

{
c:"science",
q:"Combien de pattes possède une araignée ?",
a:["6","8","10","12"],
x:1
},

{
c:"science",
q:"Quel organe pompe le sang dans le corps humain ?",
a:["Poumon","Foie","Cœur","Rein"],
x:2
},

{
c:"science",
q:"Quelle est la formule chimique de l’eau ?",
a:["CO2","H2O","O2","NaCl"],
x:1
},

{
c:"sport",
q:"Combien de joueurs une équipe de football a-t-elle sur le terrain ?",
a:["9","10","11","12"],
x:2
},

{
c:"sport",
q:"Quel sport utilise un panier ?",
a:["Football","Basketball","Tennis","Rugby"],
x:1
},

{
c:"sport",
q:"Combien de minutes dure normalement un match de football ?",
a:["60","80","90","100"],
x:2
},

{
c:"sport",
q:"Dans quel sport utilise-t-on une raquette ?",
a:["Tennis","Football","Boxe","Natation"],
x:0
},

{
c:"logique",
q:"Quel nombre vient ensuite : 2, 4, 6, 8, ?",
a:["9","10","11","12"],
x:1
},

{
c:"logique",
q:"Si 5 + 5 = 10, combien font 10 + 10 ?",
a:["15","20","25","30"],
x:1
},

{
c:"logique",
q:"Quel nombre est différent des autres ?",
a:["2","4","6","9"],
x:3
},

{
c:"logique",
q:"Tous les chats sont des animaux. Mimi est un chat. Mimi est-elle un animal ?",
a:["Oui","Non","Impossible","Seulement parfois"],
x:0
}

];


// ================================
// DONNÉES
// ================================

let data=JSON.parse(
localStorage.getItem("zenData")
)||{
level:1,
xp:0,
coins:0,
games:0,
correct:0,
best:0
};


// ================================
// VARIABLES DU JEU
// ================================

let category="all";
let mode="classic";

let gameQuestions=[];

let current=0;
let score=0;
let correct=0;
let combo=0;

let timer=null;
let time=15;


// ================================
// SAUVEGARDE
// ================================

function save(){

localStorage.setItem(
"zenData",
JSON.stringify(data)
);

updateHome();

}


// ================================
// ACCUEIL
// ================================

function updateHome(){

document.getElementById("homeLevel")
.textContent=data.level;

document.getElementById("homeXP")
.textContent=data.xp;

document.getElementById("homeCoins")
.textContent=data.coins;

document.getElementById("homeGames")
.textContent=data.games;

document.getElementById("homeBest")
.textContent=data.best;

}


// ================================
// CATÉGORIE
// ================================

function selectCategory(c){

category=c;

document.querySelectorAll(
".grid button"
).forEach(b=>{
b.classList.remove("category-selected");
});

const ids={
culture:"catCulture",
science:"catScience",
sport:"catSport",
logique:"catLogique"
};

document
.getElementById(ids[c])
.classList.add("category-selected");

const names={
culture:"🌍 Culture",
science:"🔬 Science",
sport:"⚽ Sport",
logique:"🧠 Logique"
};

document.getElementById("categoryName")
.textContent="Catégorie : "+names[c];

}


// ================================
// MODE
// ================================

function selectMode(m){

mode=m;

document.querySelectorAll(
'[id^="mode"]'
).forEach(b=>{
b.classList.remove("mode-selected");
});

const ids={
classic:"modeClassic",
chrono:"modeChrono",
survie:"modeSurvie",
challenge:"modeChallenge"
};

document
.getElementById(ids[m])
.classList.add("mode-selected");

const names={
classic:"🎯 Classique",
chrono:"⏱️ Chrono",
survie:"🔥 Survie",
challenge:"💥 Défi"
};

document.getElementById("modeName")
.textContent="Mode : "+names[m];

}


// ================================
// AFFICHAGE DES SECTIONS
// ================================

function hideAll(){

[
"home",
"game",
"result",
"statistics"
].forEach(id=>{
document
.getElementById(id)
.classList.add("hidden");
});

}


// ================================
// QUESTIONS DISPONIBLES
// ================================

function getQuestions(){

let list=questions.filter(q=>
category==="all"||q.c===category
);

return [...list].sort(
()=>Math.random()-.5
);

}


// ================================
// COMMENCER
// ================================

function startGame(){

hideAll();

document
.getElementById("game")
.classList.remove("hidden");

current=0;
score=0;
correct=0;
combo=0;

// IMPORTANT : on prépare les questions
// à chaque nouvelle partie
gameQuestions=getQuestions();

showQuestion();

}


// ================================
// AFFICHER QUESTION
// ================================

function showQuestion(){

if(current>=gameQuestions.length){

endGame();
return;

}

const q=gameQuestions[current];

document.getElementById("questionNumber")
.textContent=
"Question "+
(current+1)+
" / "+
gameQuestions.length;

document.getElementById("progress")
.style.width=
((current/gameQuestions.length)*100)+"%";

document.getElementById("combo")
.textContent=combo;

document.getElementById("question")
.textContent=q.q;


const answers=
document.getElementById("answers");

answers.innerHTML="";


q.a.forEach((answer,i)=>{

const button=
document.createElement("button");

button.className="option";

button.textContent=answer;

button.onclick=()=>{
answerQuestion(i,button);
};

answers.appendChild(button);

});


document.getElementById("message")
.textContent="";


if(
mode==="chrono"||
mode==="challenge"
){

document
.getElementById("timer")
.classList.remove("hidden");

time=
mode==="challenge"
?10
:15;

document.getElementById("timer")
.textContent=time;

clearInterval(timer);

timer=setInterval(()=>{

time--;

document.getElementById("timer")
.textContent=time;

if(time<=0){

clearInterval(timer);

answerQuestion(-1,null);

}

},1000);

}else{

document
.getElementById("timer")
.classList.add("hidden");

}

}


// ================================
// RÉPONSE
// ================================

function answerQuestion(index,button){

clearInterval(timer);

const q=gameQuestions[current];

const buttons=
document.querySelectorAll(".option");

buttons.forEach(b=>{
b.disabled=true;
});


if(index===q.x){

correct++;

combo++;

let points=
100+(combo*20);

if(mode==="chrono")
points+=50;

if(mode==="challenge")
points+=100;

score+=points;

data.xp+=points;

data.coins+=Math.max(
1,
Math.floor(points/100)
);

if(button)
button.classList.add("correct");

document.getElementById("message")
.textContent=
"✅ Bonne réponse ! +"+
points+
" XP";

}else{

combo=0;

if(button)
button.classList.add("wrong");

if(buttons[q.x])
buttons[q.x].classList.add("correct");

document.getElementById("message")
.textContent=
"❌ Pas cette fois !";

}

checkLevel();

setTimeout(()=>{

current++;

if(
mode==="survie" &&
index!==q.x
){

endGame();

}else{

showQuestion();

}

},700);

}


// ================================
// NIVEAU
// ================================

function checkLevel(){

const newLevel=
Math.floor(data.xp/500)+1;

if(newLevel>data.level){

data.level=newLevel;

}

}


// ================================
// FIN DE PARTIE
// ================================

function endGame(){

clearInterval(timer);

hideAll();

document
.getElementById("result")
.classList.remove("hidden");


data.games++;

data.correct+=correct;

if(score>data.best){

data.best=score;

}

const earnedCoins=
Math.max(
1,
Math.floor(score/100)
);


data.coins+=earnedCoins;


save();


document.getElementById("finalScore")
.textContent=score;

document.getElementById("finalXP")
.textContent=score;

document.getElementById("finalCoins")
.textContent=earnedCoins;

document.getElementById("finalCorrect")
.textContent=correct;


let message;

if(score>=700){

message="🔥 Excellent ! Tu maîtrises ZEN !";

}else if(score>=400){

message="👏 Très bon travail !";

}else{

message="💪 Continue, tu vas progresser !";

}

document.getElementById("finalMessage")
.textContent=message;

}


// ================================
// STATISTIQUES
// ================================

function showStats(){

hideAll();

document
.getElementById("statistics")
.classList.remove("hidden");


document.getElementById("sGames")
.textContent=data.games;

document.getElementById("sCorrect")
.textContent=data.correct;

document.getElementById("sBest")
.textContent=data.best;

document.getElementById("sLevel")
.textContent=data.level;

document.getElementById("sXP")
.textContent=data.xp;

document.getElementById("sCoins")
.textContent=data.coins;

}


// ================================
// QUITTER
// ================================

function quitGame(){

clearInterval(timer);

goHome();

}


// ================================
// ACCUEIL
// ================================

function goHome(){

clearInterval(timer);

hideAll();

document
.getElementById("home")
.classList.remove("hidden");

updateHome();

}


// ================================
// RÉINITIALISER
// ================================

function resetData(){

if(
confirm(
"Réinitialiser toute ta progression ?"
)
){

data={
level:1,
xp:0,
coins:0,
games:0,
correct:0,
best:0
};

save();

showStats();

}

}


// ================================
// INITIALISATION
// ================================

updateHome();

selectMode("classic");

</script>

</body>
 </html>
